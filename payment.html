<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quản lý số dư và phương thức thanh toán NEKO." />
    <title>Tài khoản thanh toán | NEKO</title>
    <script>
      try {
        if (localStorage.getItem("neko:admin") === "true" || !localStorage.getItem("neko:user")) {
          location.replace("/");
        }
      } catch (error) {
        location.replace("/");
      }
    </script>
  </head>
  <body class="user-page">
    <div data-site-header></div>

    <main class="user-main">
      <div class="container">
        <a class="btn btn-outline user-payment-back" href="/user.html">Quay lại khu vực của tôi</a>
        <section class="user-panel user-payment-account">
          <div class="user-panel-heading">
            <div>
              <p class="eyebrow">Thanh toán</p>
              <h1>Tài khoản thanh toán</h1>
            </div>
            <span class="user-panel-badge">Ví NEKO</span>
          </div>

          <p class="user-pet-form-intro">Lưu cách thanh toán bạn thường dùng để điền sẵn khi đặt lịch. NEKO không lưu số thẻ, mật khẩu ví hoặc mã xác thực.</p>
          <form id="userPaymentPreferenceForm" class="user-payment-preference">
            <fieldset class="user-payment-methods">
              <legend>Chọn phương thức ưu tiên</legend>
              <div class="user-payment-choice-list">
                <label class="user-payment-choice">
                  <input type="radio" name="paymentPreference" value="at-center" required />
                  <span><strong>Thanh toán tại trung tâm</strong><small>Thanh toán trực tiếp khi sử dụng dịch vụ.</small></span>
                </label>
                <label class="user-payment-choice">
                  <input type="radio" name="paymentPreference" value="bank-transfer" required />
                  <span><strong>Thanh toán bằng mã QR</strong><small>NEKO tạo mã QR sau khi xác nhận lịch để bạn quét và chuyển khoản.</small></span>
                </label>

              </div>
            </fieldset>
            <div class="care-form-actions">
              <button type="submit" class="care-btn care-btn-add">Lưu phương thức</button>
            </div>
          </form>
          <p class="user-form-message" id="userPaymentPreferenceMessage" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <script type="module" src="/src/paymentAccount.js"></script>
  </body>
</html>
