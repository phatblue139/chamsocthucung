<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khu vực người dùng NEKO - đăng ký và theo dõi lịch chăm sóc thú cưng." />
    <title>Khu vực người dùng | NEKO</title>
    <script>
      try {
        if (localStorage.getItem("neko:admin") === "true" || !localStorage.getItem("neko:user")) {
          location.replace("/");
        }
      } catch (error) {
        location.replace("/");
      }
    </script>
  </head>
  <body class="user-page">
    <div data-site-header></div>

    <main class="user-main">
      <div class="container">
        <section class="user-welcome">
          <p>Đăng ký lịch chăm sóc cho bé yêu và theo dõi các yêu cầu của bạn tại đây.</p>
        </section>

        <div class="user-content-grid">
          <section class="user-panel">
            <div class="user-panel-heading">
              <div>
                <p class="eyebrow">Tạo yêu cầu mới</p>
                <h2>Đăng ký lịch chăm sóc</h2>
              </div>
              <span class="user-panel-badge">Gửi tới NEKO</span>
            </div>
            <form id="userScheduleForm" class="care-form user-schedule-form">
              <div class="care-form-group">
                <label for="userPetName">Tên thú cưng</label>
                <input type="text" id="userPetName" name="petName" placeholder="Ví dụ: Miu" required />
              </div>
              <div class="care-form-group">
                <label for="userCareType">Loại chăm sóc</label>
                <select id="userCareType" name="careType" required>
                  <option value="">-- Chọn loại chăm sóc --</option>
                  <option value="Tắm">Tắm - 100.000đ</option>
                  <option value="Cắt móng">Cắt móng - 50.000đ</option>
                  <option value="Tiêm phòng">Tiêm phòng - 200.000đ</option>
                  <option value="Tẩy giun">Tẩy giun - 150.000đ</option>
                  <option value="Cho ăn">Cho ăn - 50.000đ</option>
                  <option value="Khác">Khác - theo yêu cầu</option>
                </select>
              </div>
              <div class="care-form-group" id="userCareTypeOtherGroup" hidden>
                <label for="userCareTypeOther">Tên dịch vụ khác</label>
                <input
                  type="text"
                  id="userCareTypeOther"
                  name="careTypeOther"
                  placeholder="Nhập tên dịch vụ chăm sóc"
                />
              </div>
              <div class="care-form-group">
                <label for="userScheduleDate">Ngày</label>
                <input type="date" id="userScheduleDate" name="date" required />
              </div>
              <div class="care-form-group">
                <label for="userScheduleTime">Giờ</label>
                <select id="userScheduleTime" name="time" required></select>
              </div>
              <div class="care-form-group user-form-full">
                <label for="userScheduleNote">Ghi chú</label>
                <textarea id="userScheduleNote" name="note" rows="3" maxlength="500" placeholder="Thông tin thêm cho NEKO..."></textarea>
              </div>
              <div class="care-form-actions">
                <button type="submit" class="care-btn care-btn-add">Đăng ký lịch</button>
              </div>
            </form>
            <p class="user-form-message" id="userScheduleMessage" role="status" aria-live="polite"></p>
          </section>

          <section class="user-panel user-history-panel">
            <div class="user-panel-heading">
              <div>
                <p class="eyebrow">Theo dõi</p>
                <h2>Lịch của tôi</h2>
              </div>
              <span class="care-count" id="userScheduleCount"></span>
            </div>
            <div class="user-schedule-list" id="userScheduleList"></div>
            <p class="care-empty" id="userScheduleEmpty" hidden>
              Bạn chưa có lịch chăm sóc nào. Hãy đăng ký lịch đầu tiên nhé!
            </p>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/src/user.js"></script>
  </body>
</html>
