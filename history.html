<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lịch sử các lịch chăm sóc thú cưng đã hoàn thành hoặc đã hủy." />
    <title>Lịch sử dịch vụ | NEKO</title>
    <script>
      try {
        if (localStorage.getItem("neko:admin") === "true" || !localStorage.getItem("neko:user")) {
          location.replace("/");
        }
      } catch (error) {
        location.replace("/");
      }
    </script>
  </head>
  <body class="user-page">
    <div data-site-header></div>
    <main class="user-main">
      <div class="container">
        <section class="user-welcome">
          <div class="user-welcome-copy">
            <p class="eyebrow">NEKO · KHU VỰC KHÁCH HÀNG</p>
            <h1>Lịch sử dịch vụ</h1>
            <p>Theo dõi các lịch chăm sóc đã hoàn thành hoặc đã hủy.</p>
          </div>
          <a class="care-btn care-btn-cancel" href="/user.html">Quay lại lịch đăng ký</a>
        </section>

        <section class="user-panel user-history-panel" aria-labelledby="historyHeading">
          <div class="user-panel-heading">
            <div>
              <p class="eyebrow">Các dịch vụ đã kết thúc</p>
              <h2 id="historyHeading">Lịch sử đăng ký dịch vụ</h2>
            </div>
            <span class="care-count" id="userScheduleHistoryCount">0 lịch</span>
          </div>
          <p class="user-form-message" id="historyMessage" role="status" aria-live="polite"></p>
          <div class="user-schedule-list" id="userScheduleHistoryList"></div>
          <p class="care-empty" id="userScheduleHistoryEmpty" hidden>
            Chưa có lịch nào đã hủy hoặc hoàn thành.
          </p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/userHistory.js"></script>
  </body>
</html>
