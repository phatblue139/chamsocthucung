<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Neko</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="auth-logo" href="../index.html">🐾 NEKO</a>
    <h1>Đăng nhập</h1>
    <p class="auth-subtitle">Đăng nhập với tài khoản User hoặc Admin</p>

    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Nhập email">

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu">

        <label for="role">Vai trò</label>
        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit" class="btn full">Đăng nhập</button>
        <div id="loginMessage" class="message"></div>
    </form>

    <p class="demo-account">
        User: user@neko.com / 123456<br>
        Admin: admin@neko.com / 123456
    </p>

    <a class="back-home" href="../index.html">← Về trang chủ</a>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
