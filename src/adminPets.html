<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thú cưng | NEKO</title>
  <link rel="stylesheet" href="./style.css">

  <script>
    if (localStorage.getItem("neko:admin") !== "true") {
      location.replace("/");
    }
  </script>
</head>

<body>
  <main class="care-page admin-page">
    <div class="container">

      <header class="admin-topbar">
        <a class="admin-brand" href="/src/admin.html">
          NEKO <span>ADMIN</span>
        </a>

        <nav class="admin-nav" aria-label="Quản trị">
          <a href="/src/admin.html">Tổng quan</a>
          <a class="is-current" href="/src/adminPets.html">Thú cưng</a>
          <a href="/src/careSchedules.html">Lịch chăm sóc</a>
        </nav>

        <button type="button" class="care-btn care-btn-reset" id="logoutBtn">
          Đăng xuất
        </button>
      </header>

      <section class="admin-heading">
        <p class="admin-kicker">NEKO · QUẢN TRỊ</p>
        <h1>Quản lý thú cưng</h1>
        <p id="petCount">0 hồ sơ</p>
      </section>

      <!-- FORM THÊM VÀ SỬA -->
      <form id="petForm" class="care-form admin-pet-form">
        <input type="hidden" id="petId">

        <div class="care-form-group">
          <label for="petName">Tên thú cưng *</label>
          <input
            id="petName"
            name="name"
            type="text"
            maxlength="60"
            required
            placeholder="Nhập tên thú cưng"
          >
        </div>

        <div class="care-form-group">
          <label for="petSpecies">Loài thú cưng *</label>
          <select id="petSpecies" name="species" required>
            <option value="">-- Chọn loài --</option>
            <option value="Chó">Chó</option>
            <option value="Mèo">Mèo</option>
            <option value="Khác">Khác</option>
          </select>
        </div>

        <div class="care-form-group">
          <label for="petBreed">Giống</label>
          <input
            id="petBreed"
            name="breed"
            type="text"
            maxlength="80"
            placeholder="Ví dụ: Poodle"
          >
        </div>

        <div class="care-form-group">
          <label for="petAge">Tuổi *</label>
          <input
            id="petAge"
            name="age"
            type="number"
            min="0"
            max="40"
            step="1"
            required
            placeholder="Nhập tuổi"
          >
        </div>

        <div class="care-form-group">
          <label for="petOwner">Chủ nuôi</label>
          <input
            id="petOwner"
            name="owner"
            type="text"
            maxlength="80"
            placeholder="Tên chủ nuôi"
          >
        </div>

        <div class="care-form-group">
          <label for="petUserId">Tài khoản sở hữu *</label>
          <select id="petUserId" name="userId" required>
            <option value="">-- Chọn tài khoản --</option>
          </select>
        </div>

        <div class="care-form-group">
          <label for="petGender">Giới tính</label>
          <select id="petGender" name="gender">
            <option value="">-- Chưa chọn --</option>
            <option value="Đực">Đực</option>
            <option value="Cái">Cái</option>
          </select>
        </div>

        <div class="care-form-group">
          <label for="petWeight">Cân nặng (kg)</label>
          <input id="petWeight" name="weight" type="number" min="0" max="200" step="0.1" placeholder="Ví dụ: 5">
        </div>

        <div class="care-form-group">
          <label for="petStatus">Trạng thái</label>
          <select id="petStatus" name="status" required>
            <option value="Đang chăm sóc">Đang chăm sóc</option>
            <option value="Chờ lịch">Chờ lịch</option>
          </select>
        </div>

        <div class="care-form-actions">
          <button type="submit" class="care-btn care-btn-add" id="petSaveButton">
            Thêm thú cưng
          </button>

          <button
            type="button"
            class="care-btn care-btn-cancel"
            id="petCancelButton"
            hidden
          >
            Hủy sửa
          </button>
        </div>
      </form>

      <p id="petMessage" class="user-form-message" role="status" aria-live="polite"></p>

      <!-- TÌM KIẾM VÀ LỌC -->
      <div class="admin-pet-toolbar">
        <input
          id="petSearch"
          class="care-search"
          type="search"
          placeholder="Tìm theo tên thú cưng..."
          aria-label="Tìm theo tên"
        >

        <label class="sr-only" for="speciesFilter">Lọc theo loài</label>
        <select id="speciesFilter" class="care-search species-filter">
          <option value="">Tất cả loài</option>
          <option value="Chó">Chó</option>
          <option value="Mèo">Mèo</option>
          <option value="Khác">Khác</option>
        </select>
      </div>

      <!-- DANH SÁCH THÚ CƯNG -->
      <div class="care-table-wrapper">
        <table class="care-table admin-pet-table">
          <thead>
            <tr>
              <th>Mã</th>
              <th>Tên</th>
              <th>Loài</th>
              <th>Giống</th>
              <th>Tuổi</th>
              <th>Chủ nuôi</th>
              <th>Mã tài khoản</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="petList"></tbody>
        </table>
      </div>

      <p id="petEmpty" class="care-empty" hidden>
        Không tìm thấy thú cưng phù hợp.
      </p>

      <!-- CỬA SỔ XEM CHI TIẾT -->
      <dialog id="petDetailDialog">
        <div style="padding: 20px; min-width: 280px; max-width: 450px;">
          <h2>Chi tiết thú cưng</h2>
          <div id="petDetailContent"></div>
          <button type="button" class="care-btn care-btn-cancel" id="closeDetailButton">
            Đóng
          </button>
        </div>
      </dialog>

    </div>
  </main>

  <script type="module" src="./adminPets.js"></script>
</body>
</html>
